name: Update LMB LMP News RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: lmb-lmp-news-rss
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify repository and dependencies
        shell: bash
        run: |
          set -e
          echo "Python:"
          python --version

          echo "Syntax check:"
          python -m py_compile main.py

          echo "Config check:"
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("config.json")
          if p.exists():
              with p.open("r", encoding="utf-8") as f:
                  c = json.load(f)
              print("config.json OK")
              print("Project:", c.get("project_name", c.get("feed", {}).get("title", "unknown")))
          else:
              print("No config.json found")
          PY

          echo "Dependency imports:"
          python - <<'PY'
          import feedparser
          import requests
          import trafilatura
          from googlenewsdecoder import gnewsdecoder
          print("Core feed/extraction imports OK")

          try:
              from deep_translator import GoogleTranslator
              print("deep-translator OK")
          except ImportError:
              print("deep-translator not installed (only a problem if this repository uses translation)")

          try:
              from langdetect import detect
              print("langdetect OK")
          except ImportError:
              print("langdetect not installed (only a problem if this repository uses language detection)")
          PY

      - name: Run news scanner
        id: scanner
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -o pipefail
          python -u main.py 2>&1 | tee scanner-run.log

      - name: Show scanner diagnostics
        if: always()
        shell: bash
        run: |
          echo "============================================================"
          echo "SCANNER RESULT: ${{ steps.scanner.outcome }}"
          echo "============================================================"

          if [ -f scanner-run.log ]; then
            echo "Last 300 log lines:"
            tail -n 300 scanner-run.log
          else
            echo "scanner-run.log was not created."
          fi

          echo "============================================================"
          echo "Git status:"
          git status --short || true
          echo "============================================================"

      - name: Commit generated RSS and data
        if: steps.scanner.outcome == 'success'
        shell: bash
        run: |
          set -e

          git config user.name "News RSS Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data docs

          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git commit -m "Update generated RSS and data"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt of 5..."

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Push succeeded."
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Push failed after 5 attempts."
              exit 1
            fi

            wait_seconds=$((attempt * 20))
            echo "Push failed. Waiting ${wait_seconds} seconds before retry..."
            sleep "$wait_seconds"
          done

      - name: Fail job when scanner failed
        if: steps.scanner.outcome == 'failure'
        shell: bash
        run: |
          echo "The Python scanner failed."
          echo "Open the 'Show scanner diagnostics' step above for the actual traceback/error."
          exit 1
